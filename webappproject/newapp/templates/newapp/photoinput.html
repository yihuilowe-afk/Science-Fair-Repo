<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>RecycLabel Chicago</title>
    <style>
        header {
        background-color: #6c757d;}

        .margined{
        margin-left: 20px;
        margin-right: 20px;
        margin-top: 10px;
        margin-bottom: 10px;}
    </style>
</head>
<body>
    <header>
        <br>
        <div class="margined">
            <h1>
                <strong>RecycLabel Chicago</strong>
            </h1>
        </div>
    </header>
    <br>
    <a href="{% url 'home' %}" role="button" class="btn btn-outline-secondary margined">Home</a>
    <br>
    <hr>
    <div class="margined"><h2>Photo Recognition</h2></div>
    <hr>
    <br>
    <div class="margined">
        Upload File:
        <form action="{% url 'analyze' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Analyze Photo" class="btn btn-outline-secondary">
        </form>
    </div>
</body>
</html>
