<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>RecycLabel Plastics</title>
    <style>
        header {
        background-color: #6c757d;}

        .margined{
        margin-left: 20px;
        margin-right: 20px;
        margin-top: 10px;
        margin-bottom: 10px;}

        .accordion{
        width:600px;}

        .accordion .listitem{
        list-style:none;
        width:90vw;
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 8px;
        background: #8c9299;
        box-shadow:6px 6px 10px -1px rgba(0, 0, 0, 0.15),
                    -6px -6px 10px -1px rgba(255, 255, 255, 0.7)}

        .accordion li label{
        display: flex;
        align-items: center;
        padding: 10px;
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;}

        label::before{
        content: '+';
        margin-right: 10px;
        margin-bottom: 5px;
        font-size: 24px;
        font-weight: 600px;}

        input[type="radio"]{
        display:none;}

        .accordion .content{
        padding:0 10px;
        line-height: 26 px;
        max-height:0;
        overflow: hidden;
        transition: max-height 0.5s, padding 0.5s;}

        .accordion input[type="radio"]:checked + label + .content{
        max-height: 400px;
        padding: 10px 10px 20px;}

        .accordion input[type="radio"]:checked + label::before{
        content: "-";}
    </style>
</head>
<body>
    <header>
        <br>
        <div class="margined">
            <h1>
                <strong>RecycLabel Plastics</strong>
            </h1>
        </div>
    </header>
    <br>
    <a href="{% url 'home' %}" role="button" class="btn btn-outline-secondary margined">Home</a>
    <br>
    <hr>
    <div class="margined">
        <h2>
            {{article}}<strong>{{Item}}</strong>
        </h2>
    </div>
    <hr>
    <br>
    <ul class="accordion">
        <li class="listitem">
            <input type="radio" name="accordion" id="first">
            <label for="first">Item Category</label>
            <div class="content">
                <p>{{Category}}</p>
            </div>
        </li>
        <li class="listitem">
            <input type="radio" name="accordion" id="second">
            <label for="second">Is it Recyclable?</label>
            <div class="content">
                <p>{{Status}}</p>
            </div>
        </li>
        <li class="listitem">
            <input type="radio" name="accordion" id="third">
            <label for="third">{{li3}}</label>
            <div class="content">
                <p>{{WhyORexamples|safe}}</p>
            </div>
        </li>
        {{more|safe}}
    </ul>
</body>
