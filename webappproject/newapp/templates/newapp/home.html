<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>RecycLabel Chicago</title>
    <style>
        header {
        background-color: #6c757d;}

        .margined{
        margin-left: 20px;
        margin-right: 20px;
        margin-top: 10px;
        margin-bottom: 10px;}

        .card-content{
        align: center;
        margin: 10px;}

        .form-align{
        display:flex;
        align-items: flex-start;
        gap: 10px;}


    </style>
</head>
<body>
    <header>
        <br>
        <div class="margined">
            <h1>
                <strong>RecycLabel Chicago</strong>
            </h1>
        </div>
    </header>
    <br>
    <hr>
    <div class="margined"><h2>Get Identifying:</h2></div>
    <hr>
    <br>
    <div class="row margined">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center"><strong>Plastic ID</strong></h3>
                </div>
                <div class="card-body text-center">
                    <h4 class="card-text">Use the number in the recycling symbol on your plastic item</h4>
                    <hr>
                    <br>
                    <form action="{% url 'numbers' %}" method="POST" enctype="multipart/form-data" class="form-align">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <input type="submit" value="Enter" class="btn btn-outline-secondary">
                    </form>
                </div>
            </div>
            <br>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center"><strong>Photo Recognition</strong></h3>
                </div>
                <div class="card-body text-center">
                    <h4 class="card-text">Use the photo recognition model to identify the material of your item</h4>
                    <hr>
                    <br>
                    <a href="{% url 'photo' %}" role="button" class="btn btn-outline-secondary">Upload File</a>
                    <a href="{% url 'photo' %}" role="button" class="btn btn-outline-secondary">Use Camera</a>
                </div>
            </div>
            <br>
        </div>
    </div>
    <br>
    <br>
    <br>


</body>
</html>
